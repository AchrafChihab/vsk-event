<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DJ VSK accompagne mariages, soirées privées et événements d’entreprise dans le Grand Est. Découvrez les prestations et demandez un devis." />
    <meta name="theme-color" content="#070708" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/src/assets/optimized/design/vsk-hero-1600.webp"
      imagesrcset="/src/assets/optimized/design/vsk-hero-768.webp 768w, /src/assets/optimized/design/vsk-hero-1200.webp 1200w, /src/assets/optimized/design/vsk-hero-1600.webp 1600w"
      imagesizes="100vw"
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('vsk-theme');
          const theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#070708' : '#f3f0ea';
        } catch {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#070708';
        }
      })();
    </script>
    <title>DJ VSK | DJ Mariage &amp; Événementiel Grand Est</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
